services:
  nvidia:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GPU_TYPE=nvidia
        - LOLMINER_VERSION=${LOLMINER_VERSION:-1.98a}
    container_name: ergo-miner-nvidia
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - MINER=${MINER:-lolminer}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4444:4444"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4455:4455"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4456:4456"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:5000:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  amd:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - GPU_TYPE=amd
        - LOLMINER_VERSION=${LOLMINER_VERSION:-1.98a}
    container_name: ergo-miner-amd
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4447:4444"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4458:4455"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:4459:4456"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:5001:5000"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    devices:
      - "/dev/kfd:/dev/kfd"
      - "/dev/dri:/dev/dri"
